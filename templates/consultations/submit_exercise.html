{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Entregar ejercicio: {{ exercise.title }}</div>
            <div class="card-body">
                <p><strong>Descripción:</strong> {{ exercise.description|default:"Sin descripción" }}</p>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Entregar</button>
                    <a href="{% url 'consultations:student_exercises' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
